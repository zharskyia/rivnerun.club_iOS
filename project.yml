name: RivneRunningClubApp
options:
  bundleIdPrefix: com.rivnerun.club
  developmentLanguage: uk
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

settings:
  SWIFT_VERSION: 5.9
  IPHONEOS_DEPLOYMENT_TARGET: 17.0

targets:
  RivneRunningClubApp:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: Sources/RivneRunningClubApp
    info:
      path: Sources/RivneRunningClubApp/Info.plist
      properties:
        CFBundleDisplayName: RivneRunningClubApp
        CFBundleShortVersionString: 1.0
        CFBundleVersion: 1
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.rivnerun.club.RivneRunningClubApp
      TARGETED_DEVICE_FAMILY: 1
      ASSETCATALOG_COMPILER_APPICON_NAME: ""
      SWIFT_VERSION: 5.9
